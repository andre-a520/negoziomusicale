<div class="container">

  <h2>Lista Artisti</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Genere</th>
        <th>Paese</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let t of artists">
        <td>{{t.id}}</td>
        <td>{{t.name}}</td>
        <td>{{t.genre}}</td>
        <td>{{t.country}}</td>
      </tr>
    </tbody>
  </table>

  <div class="home">
    <a routerLink="/">Home</a>
  </div>

</div>
